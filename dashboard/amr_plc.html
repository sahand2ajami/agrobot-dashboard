<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMR ↔ PLC Handshake</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f1f5f9;
  --panel:    #ffffff;
  --card:     #f8fafc;
  --border:   #e2e8f0;
  --border2:  #d4dce9;
  --text:     #1e293b;
  --muted:    #64748b;
  --dim:      #94a3b8;
  --green:    #16a34a;
  --green-lt: #f0fdf4;
  --green-bd: #86efac;
  --blue:     #2563eb;
  --blue-lt:  #eff6ff;
  --blue-bd:  #93c5fd;
  --amber:    #b45309;
  --red:      #dc2626;
  --red-lt:   #fef2f2;
  --red-bd:   #fca5a5;
  --mono:     'Courier New', Courier, monospace;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
}

/* ── HEADER ──────────────────────────────────────────────────────────── */
header {
  height: 56px;
  background: #0f2940;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 50;
  flex-shrink: 0;
}

.hdr-left { display: flex; align-items: center; gap: 18px; }

.hdr-logo {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #7dd3fc;
  opacity: 0.8;
}

header h1 {
  font-size: 17px;
  font-weight: 600;
  color: #ffffff;
}

#conn-pill {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 13px;
  color: #94a3b8;
  transition: all 0.3s;
  white-space: nowrap;
}

.conn-led {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #475569;
  flex-shrink: 0;
  transition: all 0.3s;
}

#conn-pill.online  { border-color: rgba(74,222,128,0.5);  color: #4ade80; }
#conn-pill.online .conn-led { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
#conn-pill.offline { border-color: rgba(248,113,113,0.5); color: #f87171; }
#conn-pill.offline .conn-led { background: #f87171; }

/* ── PAGE LAYOUT ─────────────────────────────────────────────────────── */
.page { display: flex; flex-direction: column; height: calc(100vh - 56px); }

.panels {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  border-bottom: 2px solid var(--border);
}

@media (max-width: 820px) {
  .panels { grid-template-columns: 1fr; overflow: auto; }
  .page { height: auto; }
}

.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--panel);
}
.panel + .panel { border-left: 2px solid var(--border); }

.panel-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  flex-shrink: 0;
}

.panel-hdr h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 4px;
  flex-shrink: 0;
}
.badge-read  { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.badge-write { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

.panel-hint { margin-left: auto; font-size: 12px; color: var(--dim); }

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ── REGISTER CARD ────────────────────────────────────────────────────── */
.reg-card {
  border: 1px solid var(--border2);
  border-radius: 8px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: 0 1px 3px rgba(15,30,60,0.06);
}

.reg-title {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  padding: 11px 16px 10px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.reg-name {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text);
}

.reg-addr {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--muted);
}

.reg-fc {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}

.reg-val {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
}

/* ── STATUS BITS (PLC→AMR) ───────────────────────────────────────────── */
.bit-list { padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 2px; }

.bit-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 10px;
  border-radius: 6px;
  transition: background 0.1s;
}
.bit-row:hover { background: var(--bg); }

.bit-led {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  background: var(--bg);
  flex-shrink: 0;
  transition: all 0.2s;
}
.bit-led.on {
  background: var(--green);
  border-color: var(--green);
  box-shadow: 0 0 10px rgba(22,163,74,0.35);
}

.bit-lbl {
  flex: 1;
  font-size: 15px;
  color: var(--muted);
  transition: color 0.2s;
}
.bit-lbl.on { color: var(--text); font-weight: 600; }

.bit-info {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  flex-shrink: 0;
}

.bit-badge {
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--dim);
  flex-shrink: 0;
  transition: all 0.2s;
}
.bit-badge.on {
  background: var(--green-lt);
  border-color: var(--green-bd);
  color: var(--green);
}

/* ── COMMAND BUTTONS (AMR→PLC) ───────────────────────────────────────── */
.cmd-area {
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cmd-btn {
  width: 100%;
  padding: 14px 18px;
  border-radius: 7px;
  border: 1.5px solid var(--border2);
  background: var(--panel);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.cmd-btn:hover {
  background: var(--blue-lt);
  border-color: var(--blue-bd);
  color: var(--blue);
}
.cmd-btn.active {
  background: var(--green-lt);
  border-color: #4ade80;
  color: var(--green);
}
.cmd-btn.active:hover { background: #dcfce7; }

.cmd-btn.state-on {
  background: var(--blue-lt);
  border-color: var(--blue-bd);
  color: var(--blue);
}
.cmd-btn.state-on:hover { background: #dbeafe; }

.state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.cmd-btn.clear-btn {
  font-size: 13px;
  padding: 10px;
  color: var(--dim);
  border-color: var(--border);
  background: var(--card);
}
.cmd-btn.clear-btn:hover {
  color: var(--red);
  border-color: var(--red-bd);
  background: var(--red-lt);
}

/* ── LOG PANEL ───────────────────────────────────────────────────────── */
.log-wrap {
  flex-shrink: 0;
  height: 230px;
  display: flex;
  flex-direction: column;
  background: #ffffff;
}

.log-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  flex-shrink: 0;
}

.log-hdr h3 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

.log-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}

.log-clear {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 10px;
  cursor: pointer;
}
.log-clear:hover { color: var(--red); border-color: var(--red-bd); }

#log-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px 22px 10px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
}

.le {
  display: flex;
  gap: 18px;
  padding: 2px 0;
  border-bottom: 1px solid #f1f5f9;
  align-items: baseline;
}

.le-ts  { color: var(--dim); flex-shrink: 0; }
.le-msg { color: var(--muted); word-break: break-all; }

.le.log-connect    .le-msg { color: var(--green); }
.le.log-disconnect .le-msg { color: var(--red); font-weight: 600; }
.le.log-write      .le-msg { color: var(--blue); }
.le.log-change     .le-msg { color: var(--amber); font-weight: 600; }
.le.log-error      .le-msg { color: var(--red); font-weight: 600; }
.le.log-info       .le-msg { color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <span class="hdr-logo">Agrobot</span>
    <h1>AMR ↔ PLC Handshake</h1>
  </div>
  <div id="conn-pill">
    <div class="conn-led"></div>
    <span id="conn-text">Connecting…</span>
  </div>
</header>

<div class="page">

  <div class="panels">

    <!-- ── PLC STATUS (PLC → AMR) ───────────────────────────────── -->
    <div class="panel">
      <div class="panel-hdr">
        <span class="badge badge-read">PLC → AMR</span>
        <h2>PLC Status</h2>
        <span class="panel-hint">read-only · 500 ms</span>
      </div>
      <div class="panel-body" id="status-body"></div>
    </div>

    <!-- ── AMR COMMANDS (AMR → PLC) ─────────────────────────────── -->
    <div class="panel">
      <div class="panel-hdr">
        <span class="badge badge-write">AMR → PLC</span>
        <h2>AMR Commands</h2>
        <span class="panel-hint">writable · read-back confirmed</span>
      </div>
      <div class="panel-body" id="cmd-body"></div>
    </div>

  </div>

  <!-- ── EVENT LOG ─────────────────────────────────────────────── -->
  <div class="log-wrap">
    <div class="log-hdr">
      <h3>Event Log</h3>
      <span class="log-count" id="log-count"></span>
      <button class="log-clear" onclick="_clearLog()">Clear</button>
    </div>
    <div id="log-body"></div>
  </div>

</div><!-- .page -->

<script>
'use strict';

// FEnet offsets — must match XG5000 Modbus Settings and plc_test.py
const READ_OFFSET  = 1000;   // FC04 reg N reads  %MW(1000+N)
const WRITE_OFFSET = 5000;   // FC06 reg N writes %MW(5000+N)

// ── Register definitions ──────────────────────────────────────────────

const PLC_STATUS = [
  {
    key: 'mw5100', plcAddr: 5100, addr: '%MW5100', label: 'AUGER STATUS',
    bits: [
      { bit: 0, label: 'Sequence Start Handshake' },
      { bit: 1, label: 'Clear of Ground' },
      { bit: 2, label: 'Cycle Complete' },
    ],
  },
  {
    key: 'mw5101', plcAddr: 5101, addr: '%MW5101', label: 'PLANTER STATUS',
    bits: [
      { bit: 0, label: 'Sequence Start Handshake' },
      { bit: 1, label: 'Clear of Ground' },
      { bit: 2, label: 'Cycle Complete' },
    ],
  },
];

const AMR_CMDS = [
  {
    reg: 5110, key: 'mw5110', addr: '%MW5110', label: 'AUGER COMMAND',
    type: 'toggle', bit: 1, mask: 2,
    onLabel:  'ACTIVE — AUGER START SET',
    offLabel: 'SET AUGER START SEQUENCE',
  },
  {
    reg: 5111, key: 'mw5111', addr: '%MW5111', label: 'PLANTER COMMAND',
    type: 'toggle', bit: 1, mask: 2,
    onLabel:  'ACTIVE — PLANTER START SET',
    offLabel: 'SET PLANTER START SEQUENCE',
  },
  {
    reg: 5112, key: 'mw5112', addr: '%MW5112', label: 'AMR STATE',
    type: 'state',
    states: [
      { bit: 0, value: 1, label: 'STATIONARY' },
      { bit: 1, value: 2, label: 'MOVING' },
    ],
  },
];

// ── Runtime state ─────────────────────────────────────────────────────

let _cur  = {};
let _prev = {};
let _connected = null;
let _logBuf    = [];
const LOG_MAX  = 500;

// ── Build static DOM ──────────────────────────────────────────────────

function _buildStatus() {
  const body = document.getElementById('status-body');
  PLC_STATUS.forEach(r => {
    const fc04 = r.plcAddr - READ_OFFSET;
    const card = document.createElement('div');
    card.className = 'reg-card';
    card.innerHTML =
      `<div class="reg-title">` +
        `<span class="reg-name">${r.label}</span>` +
        `<span class="reg-addr">${r.addr}</span>` +
        `<span class="reg-fc">FC04 reg ${fc04}</span>` +
        `<span class="reg-val" id="sv-${r.key}">—</span>` +
      `</div>` +
      `<div class="bit-list">` +
        r.bits.map(b =>
          `<div class="bit-row">` +
            `<div class="bit-led" id="led-${r.key}-${b.bit}"></div>` +
            `<span class="bit-lbl" id="lbl-${r.key}-${b.bit}">${b.label}</span>` +
            `<span class="bit-info">bit ${b.bit}</span>` +
            `<div class="bit-badge" id="bdg-${r.key}-${b.bit}">0</div>` +
          `</div>`
        ).join('') +
      `</div>`;
    body.appendChild(card);
  });
}

function _buildCmds() {
  const body = document.getElementById('cmd-body');
  AMR_CMDS.forEach(r => {
    const fc06 = r.reg - WRITE_OFFSET;
    const fc04 = r.reg - READ_OFFSET;
    const card = document.createElement('div');
    card.className = 'reg-card';

    let inner =
      `<div class="reg-title">` +
        `<span class="reg-name">${r.label}</span>` +
        `<span class="reg-addr">${r.addr}</span>` +
        `<span class="reg-fc">FC06 reg ${fc06} · readback FC04 reg ${fc04}</span>` +
        `<span class="reg-val" id="cv-${r.key}">—</span>` +
      `</div>`;

    if (r.type === 'toggle') {
      inner +=
        `<div class="cmd-area">` +
          `<button class="cmd-btn" id="cb-${r.key}"` +
          ` onclick="_toggleCmd(${r.reg},'${r.key}',${r.mask})">` +
            `▶  ${r.offLabel}` +
          `</button>` +
        `</div>`;
    } else {
      inner +=
        `<div class="cmd-area">` +
          `<div class="state-grid">` +
            r.states.map(s =>
              `<button class="cmd-btn" id="cb-${r.key}-${s.bit}"` +
              ` onclick="_setCmd(${r.reg},'${r.key}',${s.value})">${s.label}</button>`
            ).join('') +
          `</div>` +
          `<button class="cmd-btn clear-btn"` +
          ` onclick="_setCmd(${r.reg},'${r.key}',0)">CLEAR STATE</button>` +
        `</div>`;
    }

    card.innerHTML = inner;
    body.appendChild(card);
  });
}

// ── Update UI from poll data ──────────────────────────────────────────

function _fmtVal(v) {
  return v != null
    ? `${v}  (0x${v.toString(16).toUpperCase().padStart(4,'0')})`
    : '—';
}

function _updateStatus(data) {
  PLC_STATUS.forEach(r => {
    const val = data[r.key];
    const el  = document.getElementById(`sv-${r.key}`);
    if (el) el.textContent = _fmtVal(val);
    r.bits.forEach(b => {
      const on  = val != null ? !!((val >> b.bit) & 1) : null;
      const led = document.getElementById(`led-${r.key}-${b.bit}`);
      const lbl = document.getElementById(`lbl-${r.key}-${b.bit}`);
      const bdg = document.getElementById(`bdg-${r.key}-${b.bit}`);
      if (led) led.className = 'bit-led' + (on ? ' on' : '');
      if (lbl) lbl.className = 'bit-lbl' + (on ? ' on' : '');
      if (bdg) {
        bdg.textContent = on != null ? (on ? '1' : '0') : '—';
        bdg.className   = 'bit-badge' + (on ? ' on' : '');
      }
    });
  });
}

function _updateCmds(data) {
  AMR_CMDS.forEach(r => {
    const val = data[r.key];
    const ve  = document.getElementById(`cv-${r.key}`);
    if (ve) ve.textContent = _fmtVal(val);

    if (r.type === 'toggle') {
      const active = val != null && !!(val & r.mask);
      const btn    = document.getElementById(`cb-${r.key}`);
      if (btn) {
        btn.className   = 'cmd-btn' + (active ? ' active' : '');
        btn.textContent = active ? ('■  ' + r.onLabel) : ('▶  ' + r.offLabel);
      }
    } else {
      r.states.forEach(s => {
        const btn = document.getElementById(`cb-${r.key}-${s.bit}`);
        if (!btn) return;
        btn.className = 'cmd-btn' + (val != null && val === s.value ? ' state-on' : '');
      });
    }
  });
}

// ── Write helpers ─────────────────────────────────────────────────────

async function _doWrite(reg, value) {
  const fc06 = reg - WRITE_OFFSET;
  const fc04 = reg - READ_OFFSET;
  try {
    const res = await fetch('/api/amr/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reg, value }),
    });
    const d = await res.json();
    if (d.success) {
      // Mirror plc_test.py output exactly
      _log('write', d.message);
      if (d.readback != null) {
        const ok = d.confirmed
          ? '✓ confirmed'
          : '✗ mismatch — PLC ladder may have overwritten it';
        _log('write', `readback %MW${reg} = ${d.readback}  (FC04 reg ${fc04})  ${ok}`);
      } else {
        _log('write', `readback %MW${reg}: unavailable  (FC04 reg ${fc04})`);
      }
    } else {
      _log('error', `WRITE FAILED %MW${reg} = ${value}  (FC06 reg ${fc06}): ${d.message}`);
    }
    return d;
  } catch (e) {
    _log('error', `Write error: ${e.message}`);
    return null;
  }
}

async function _toggleCmd(reg, key, mask) {
  const cur    = _cur[key] != null ? _cur[key] : 0;
  const newVal = (cur & mask) ? (cur & ~mask) : (cur | mask);
  const d      = await _doWrite(reg, newVal & 0xFFFF);
  if (d && d.success) {
    _cur[key] = d.readback != null ? d.readback : newVal;
    _updateCmds(_cur);
  }
}

async function _setCmd(reg, key, value) {
  const d = await _doWrite(reg, value);
  if (d && d.success) {
    _cur[key] = d.readback != null ? d.readback : value;
    _updateCmds(_cur);
  }
}

// ── Connection indicator ──────────────────────────────────────────────

function _setConn(online, text) {
  document.getElementById('conn-pill').className = online ? 'online' : 'offline';
  document.getElementById('conn-text').textContent = text;
}

// ── Event log ─────────────────────────────────────────────────────────

function _ts() {
  const n = new Date();
  return n.toTimeString().slice(0,8) + '.'
    + String(n.getMilliseconds()).padStart(3,'0');
}

function _log(type, msg) {
  _logBuf.unshift({ ts: _ts(), type, msg });
  if (_logBuf.length > LOG_MAX) _logBuf.length = LOG_MAX;
  _renderLog();
}

function _renderLog() {
  const el = document.getElementById('log-body');
  el.innerHTML = _logBuf.map(e =>
    `<div class="le log-${e.type}">` +
      `<span class="le-ts">${e.ts}</span>` +
      `<span class="le-msg">${e.msg}</span>` +
    `</div>`
  ).join('');
  const cnt = document.getElementById('log-count');
  if (cnt) cnt.textContent = _logBuf.length > 0 ? `${_logBuf.length} entries` : '';
}

function _clearLog() { _logBuf = []; _renderLog(); }

// ── Poll ──────────────────────────────────────────────────────────────

async function _poll() {
  let data;
  try {
    data = await fetch('/api/amr/poll').then(r => r.json());
  } catch (e) {
    if (_connected !== false) {
      _setConn(false, 'Server unreachable');
      _log('disconnect', 'Dashboard server unreachable');
      _connected = false;
    }
    return;
  }

  // Connection state change
  if (_connected !== data.connected) {
    if (data.connected) {
      _setConn(true, `Online · ${data.host}:${data.port} · ${data.latency_ms} ms`);
      _log('connect', `Connected → ${data.host}:${data.port}  (${data.latency_ms} ms)`);
    } else {
      _setConn(false, `Offline · ${data.host}:${data.port}`);
      _log('disconnect', `PLC offline · ${data.error || 'no response'}`);
    }
    _connected = data.connected;
  } else if (data.connected) {
    document.getElementById('conn-text').textContent =
      `Online · ${data.host}:${data.port} · ${data.latency_ms} ms`;
  }

  // Detect PLC status bit changes (plc_test.py style format)
  if (data.connected) {
    PLC_STATUS.forEach(r => {
      const nv = data[r.key];
      const ov = _prev[r.key];
      if (nv != null && ov != null && nv !== ov) {
        r.bits.forEach(b => {
          const nb = (nv >> b.bit) & 1;
          const ob = (ov >> b.bit) & 1;
          if (nb !== ob) {
            _log('change', `${r.addr} bit ${b.bit} (${b.label}): ${ob} → ${nb}`);
          }
        });
      }
    });
  }

  Object.assign(_prev, data);
  _cur = { ..._cur, ...data };

  _updateStatus(data);
  _updateCmds(data);
}

// ── Init ──────────────────────────────────────────────────────────────

_buildStatus();
_buildCmds();
_log('info', `Dashboard started. Polling %MW5100–5112 every 500 ms.`);
_log('info', `FC04 read offset: ${READ_OFFSET}  |  FC06 write offset: ${WRITE_OFFSET}`);
setInterval(_poll, 500);
_poll();
</script>
</body>
</html>
